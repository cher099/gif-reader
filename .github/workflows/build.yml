name: Build Photos GIF tweak

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out Photos GIF
        uses: actions/checkout@v4

      - name: Set up Theos and the iOS 6.1 SDK
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/Sn0wCooder/theos-sdks

      - name: Assemble the split iOS 6.1 SDK
        run: |
          sdk_parts="$THEOS/sdks/iPhoneOS6.1.sdk"
          sdk_unpack="$RUNNER_TEMP/ios6-sdk"
          cat "$sdk_parts"/iPhoneOS6.1.sdk.zip.00* > "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip"
          mkdir -p "$sdk_unpack"
          unzip -q "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip" -d "$sdk_unpack"
          rm -rf "$sdk_parts" "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip"
          mv "$sdk_unpack/iPhoneOS6.1.sdk" "$THEOS/sdks/iPhoneOS6.1.sdk"
          test -f "$THEOS/sdks/iPhoneOS6.1.sdk/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

      - name: Build rootful armv7 package
        run: make package

      - name: Give package a friendly filename
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          deb_path="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$version"
          test -n "$deb_path"
          mv "$deb_path" "packages/Photos-GIF_${version}_iphoneos-arm.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Photos-GIF-deb
          path: packages/Photos-GIF_*.deb
          if-no-files-found: error
